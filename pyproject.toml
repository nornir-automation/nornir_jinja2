[project]
name = "nornir_jinja2"
version = "1.0.0"
description = "Jinja2 plugins for nornir"
authors = [{ name = "David Barroso", email = "dbarrosop@dravetech.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.rst"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # allow-prereleases carried over from Poetry: the >=3.0.0a0 floor opts nornir
    # (and only nornir) into prereleases, matching the old `allow-prereleases = true`.
    "nornir>=3.0.0a0,<4",
    "jinja2>=2.11.2,<4",
]

[project.urls]
Repository = "https://github.com/nornir-automation/nornir_jinja2"

[dependency-groups]
dev = [
    "click==8.0.1",
    "mypy",
    "ruff",
    "pytest",
    "nbval",
    "jupyter>=1,<2",
]
docs = [
    "sphinx>=3.0.3,<4",
    "sphinxcontrib-napoleon>=0.7,<0.8",
    "nbsphinx>=0.6.1,<0.7",
    "sphinx-issues>=1.2.0,<2",
    "sphinx-rtd-theme>=0.4.3,<0.5",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore::nornir.core.exceptions.ConflictingConfigurationWarning"]

[tool.mypy]
# The mypy configurations: http://bit.ly/2zEl9WI
python_version = "3.10"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
ignore_errors = false
ignore_missing_imports = true
strict_optional = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["ALL"]

ignore = [
    "CPY001", # Missing copyright notice at top of file
    "D203",   # Incompatible with D211, ruff warns unless one is disabled
    "D213",   # Incompatible with D212, ruff warns unless one is disabled
]

[tool.ruff.lint.mccabe]
max-complexity = 10


[tool.ruff.lint.per-file-ignores]


"nornir_jinja2/**/*.py" = [
    ##################################################################################################
    # Review and change the below later                                                              #
    ##################################################################################################
    "ANN401", # Dynamically typed expressions (typing.Any) disallowed
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D212",   # Multi-line docstring summary should start at the first line
    "D400",   # First line should end with a period
    "D401",   # First line of docstring should be in imperative mood
    "D413",   # Missing blank line after last section
    "D415",   # First line should end with a period, question mark, or exclamation point
    "D417",   # Missing argument description in the docstring
    "EM101",  # Exception must not use a string literal, assign to variable first
    "I001",   # Import block is un-sorted or un-formatted
    "S701",   # By default, jinja2 sets `autoescape` to False
    "SIM108", # Use ternary operator instead of `if`-`else`-block
    "TRY003", # Avoid specifying long messages outside the exception class
]


"tests/**/*.py" = [
    "S101",   # Use of `assert` detected, ok in tests
    ##################################################################################################
    # Review and change the below later                                                              #
    ##################################################################################################
    "ANN001", # Missing type annotation for function argument
    "ANN201", # Missing return type annotation for public function
    "ARG001", # Unused function argument
    "D100",   # Missing docstring in public module
    "D101",   # Missing docstring in public class
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D104",   # Missing docstring in public package
    "D400",   # First line should end with a period
    "D401",   # First line of docstring should be in imperative mood
    "D415",   # First line should end with a period, question mark, or exclamation point
    "I001",   # Import block is un-sorted or un-formatted
    "INP001", # File is part of an implicit namespace package, add an `__init__.py`
    "PT003",  # `scope='function'` is implied in `@pytest.fixture()`
    "PTH120", # `os.path.dirname()` should be replaced by `Path.parent`
    "S701",   # By default, jinja2 sets `autoescape` to False
]


"docs/source/conf.py" = [
    ##################################################################################################
    # Review and change the below later                                                              #
    ##################################################################################################
    "A001",   # Variable is shadowing a Python builtin
    "D100",   # Missing docstring in public module
    "ERA001", # Found commented-out code
    "INP001", # File is part of an implicit namespace package, add an `__init__.py`
]


[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
