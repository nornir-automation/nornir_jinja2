[project]
name = "nornir_jinja2"
version = "1.0.0"
description = "Jinja2 plugins for nornir"
authors = [{ name = "David Barroso", email = "dbarrosop@dravetech.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.rst"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # allow-prereleases carried over from Poetry: the >=3.0.0a0 floor opts nornir
    # (and only nornir) into prereleases, matching the old `allow-prereleases = true`.
    "nornir>=3.0.0a0,<4",
    "jinja2>=2.11.2,<4",
]

[project.urls]
Repository = "https://github.com/nornir-automation/nornir_jinja2"

[dependency-groups]
dev = [
    "click==8.0.1",
    "mypy",
    "ruff",
    "pytest",
    "nbval",
    "jupyter>=1,<2",
]
docs = [
    "sphinx>=3.0.3,<4",
    "sphinxcontrib-napoleon>=0.7,<0.8",
    "nbsphinx>=0.6.1,<0.7",
    "sphinx-issues>=1.2.0,<2",
    "sphinx-rtd-theme>=0.4.3,<0.5",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore::nornir.core.exceptions.ConflictingConfigurationWarning"]

[tool.mypy]
# The mypy configurations: http://bit.ly/2zEl9WI
python_version = "3.10"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
ignore_errors = false
ignore_missing_imports = true
strict_optional = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# Port of the previous pylama linters: pep8 (E/W) + pyflakes (F) + mccabe (C90)
# UP keeps annotations on PEP 585/604 syntax now that we require Python >= 3.10
select = ["E", "W", "F", "C90", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
