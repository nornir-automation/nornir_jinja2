[tool.poetry]
name = "nornir_jinja2"
version = "0.2.0"
description = "Jinja2 plugins for nornir"
authors = ["David Barroso <dbarrosop@dravetech.com>"]
license = "Apache-2.0"

[tool.poetry.dependencies]
python = "^3.10"
nornir = { version = "~3", allow-prereleases = true }
jinja2 = "^2.11.2|~3"

[tool.poetry.dev-dependencies]
click = "8.0.1"
black = "^25"
mypy = "*"
ruff = "*"
pytest = "*"
nbval = "*"
jupyter = "^1"
sphinx = "^3.0.3"
sphinxcontrib-napoleon = "^0.7"
nbsphinx = "^0.6.1"
sphinx-issues = "^1.2.0"
sphinx_rtd_theme = "^0.4.3"


[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Port of the previous pylama linters: pep8 (E/W) + pyflakes (F)
select = ["E", "W", "F"]

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"
